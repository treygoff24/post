# The public clean gate on both supported platforms. macOS carries the
# launchd doorbell installer; Linux exercises the inotify watch backend.
#
# CI runs scripts/gate.sh rather than restating its steps: a hand-copied list
# drifts silently, and a gate that asks six of seven questions reads exactly
# like one that asked all seven. The doorbell suite was missing here for that
# reason.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate
        run: ./scripts/gate.sh
