# The public clean gate on both supported platforms. macOS carries the
# launchd doorbell installer; Linux exercises the inotify watch backend.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features
      - name: Release build
        run: cargo build --release
      - name: Hook adapter tests
        run: node --test skills/post/hooks/*.test.mjs
      - name: Launcher tests
        run: node --test launcher/*.test.mjs
      - name: Schema smoke
        run: target/release/post schema >/dev/null
