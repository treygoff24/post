[package]
name = "post"
version = "0.4.0"
edition = "2021"
description = "Machine-local mailbox for AI agents"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
unicode-segmentation = "1"
unicode-normalization = "0.1"
regex = "1"
