[package]
name = "post"
version = "0.7.0"
edition = "2021"
description = "Machine-local mailbox for AI agents"
license = "MIT"
repository = "https://github.com/treygoff24/post"
homepage = "https://github.com/treygoff24/post"
documentation = "https://github.com/treygoff24/post/blob/main/CONTRACT.md"
readme = "README.md"
# Not on crates.io (the name is taken); distributed as source + prebuilt
# release binaries via dist, which needs the explicit opt-in below because
# publish = false would otherwise hide the package from it.
publish = false

[package.metadata.dist]
dist = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
unicode-segmentation = "1"
unicode-normalization = "0.1"
regex = "1"
sha2 = "0.10"
notify = "8.2.0"

[dev-dependencies]
# The v2 signed-message tests rebuild the manifest INDEPENDENTLY of
# src/mailbox.rs::v2_manifest so a format drift in either copy fails the
# byte comparison instead of drifting in lockstep.
sha2 = "0.10"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
