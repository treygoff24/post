[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# No CI backend: releases are built and signed locally on the Mac (Apple
# Developer ID signing can't run on GitHub runners without exporting the key).
# Hosting stays github so the shell installer points at GitHub Releases.
hosting = ["github"]
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
# musl (not gnu) for Linux: pure-Rust dep tree, fully static, runs on any distro.
# No Windows: post is unix-only (libc, launchd/systemd doorbells).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Where the shell installer puts the binary (matches the documented ~/.local/bin install)
install-path = "~/.local/bin"
